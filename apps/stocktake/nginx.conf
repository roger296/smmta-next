server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA: unknown paths fall back to index.html (client-side router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable; cache hard. index.html must never be cached
  # so a redeploy is picked up immediately.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # PWA service worker + manifest must not be cached, or an iPad that counted
  # last quarter keeps serving the stale bundle from its home-screen icon.
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
}
