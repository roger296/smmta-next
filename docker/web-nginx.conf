# nginx for the admin SPA. Serves the built Vite bundle and proxies /api to the
# API service (Coolify puts them on the same internal network). If you instead
# point the SPA at the API's public URL via VITE_API_BASE_URL at build time, the
# /api proxy block is unused and harmless.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Discovery addresses (/.well-known/...) are not pages of the admin, so they
  # must not fall through to index.html. MCP clients such as claude.ai probe
  # /.well-known/oauth-protected-resource and oauth-authorization-server before
  # connecting; a 200 HTML page there reads as broken OAuth metadata and the
  # connector refuses to connect. A 404 tells them the server has no OAuth, so
  # they use the configured Authorization header (docs/MCP-CONNECTOR.md).
  location ^~ /.well-known/ {
    default_type application/json;
    return 404 '{"error":"not_found"}';
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional same-origin API proxy (service name 'api' on the Coolify network).
  location /api/ {
    # Look the API up through Docker's DNS on every request (cached 10 s),
    # not once at start-up. A fixed `proxy_pass http://api:3000` pins the IP
    # nginx saw when it started; when the api container restarts (a crash, a
    # full disk, a redeploy of just the api) it comes back on a new IP and
    # every /api call is a 502 until this container is restarted too.
    # With a variable, proxy_pass passes the request URI on unchanged, as before.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    # Product image uploads pass through here. nginx defaults to 1m, which
    # silently rejected any photograph bigger than that with its own HTML 413
    # — before the request reached the API, which accepts 8MB and says so in
    # the UI. A phone photo is typically 2-5MB, so in practice every real
    # upload failed while a small test image succeeded.
    #
    # Set above the API's own cap on purpose: the API should be the thing that
    # enforces the limit, so an oversized file gets its JSON error naming the
    # size rather than an opaque HTML page from the proxy. The extra room also
    # covers multipart framing overhead on a file right at the cap.
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (sales-agent chat) needs buffering off.
    proxy_buffering off;
  }

  # Long cache for hashed assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
