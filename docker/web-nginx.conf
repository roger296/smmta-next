# nginx for the admin SPA. Serves the built Vite bundle and proxies /api to the
# API service (Coolify puts them on the same internal network). If you instead
# point the SPA at the API's public URL via VITE_API_BASE_URL at build time, the
# /api proxy block is unused and harmless.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional same-origin API proxy (service name 'api' on the Coolify network).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (sales-agent chat) needs buffering off.
    proxy_buffering off;
  }

  # Long cache for hashed assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
