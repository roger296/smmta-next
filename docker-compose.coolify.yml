# Production stack for Coolify (Docker Compose resource). All five services on
# one internal network. Set the secrets + domains in the Coolify UI (see
# docs/COOLIFY-DEPLOY.md). The API runs migrations on start; the worker consumes
# the same Postgres. Money/credentials are TEST/sandbox until you swap to live.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smmta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smmta_next}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the second database (smmta_store) on first boot.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smmta} -d ${POSTGRES_DB:-smmta_next}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smmta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smmta_next}
      # The API entrypoint self-heals the storefront DB: creates smmta_store if
      # missing (init scripts only run on a fresh volume) and runs the store's
      # own drizzle migrations against it before booting.
      STORE_DATABASE_URL: postgresql://${POSTGRES_USER:-smmta}:${POSTGRES_PASSWORD}@postgres:5432/smmta_store
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COMPANY_ID: ${COMPANY_ID:-11111111-1111-4111-8111-111111111111}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PGBOSS_SCHEMA: pgboss
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DAILY_CAP_MICROUSD: ${OPENROUTER_DAILY_CAP_MICROUSD:-2000000}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_WEBHOOK_KEY: ${SENDGRID_WEBHOOK_KEY:-change-me}
      # Base64 public key from SendGrid's Signed Event Webhook (verifies inbound
      # bounce/complaint/unsubscribe events). Empty → the webhook rejects all.
      SENDGRID_WEBHOOK_VERIFICATION_KEY: ${SENDGRID_WEBHOOK_VERIFICATION_KEY:-}
      SENDGRID_SANDBOX: ${SENDGRID_SANDBOX:-true}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?set UNSUBSCRIBE_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      # Back-in-stock dispatch: the API calls the storefront's internal
      # email-rendering route. Both halves of the shared secret must be set and
      # equal (the API sends STORE_INTERNAL_API_KEY; the store checks it against
      # its own ADMIN_API_KEY) or "notify me when back in stock" silently never
      # sends. Internal URL — this call never leaves the Docker network.
      STORE_BASE_URL: ${STORE_INTERNAL_URL:-http://store:3000}
      STORE_INTERNAL_API_KEY: ${STORE_INTERNAL_API_KEY:-}
      # Uploaded product images live here and are served from /uploads. MUST be
      # a mounted volume: a container filesystem does not survive a redeploy,
      # and every uploaded photograph would 404 after the next deploy.
      UPLOADS_DIR: /app/uploads
      # Smooth Parcel shipping labels. OFF until SMOOTH_PARCEL_ENABLED is set;
      # with it off, paid orders record a DISABLED label and nothing is bought.
      # BETA unless told otherwise — LIVE is https://api.smoothparcel.com. Set
      # the username (account email) and password in Coolify, never the repo.
      SMOOTH_PARCEL_ENABLED: ${SMOOTH_PARCEL_ENABLED:-false}
      SMOOTH_PARCEL_API_BASE_URL: ${SMOOTH_PARCEL_API_BASE_URL:-https://api-beta.smoothparcel.com}
      SMOOTH_PARCEL_USERNAME: ${SMOOTH_PARCEL_USERNAME:-}
      SMOOTH_PARCEL_PASSWORD: ${SMOOTH_PARCEL_PASSWORD:-}
      SMOOTH_PARCEL_SENDER_NAME: ${SMOOTH_PARCEL_SENDER_NAME:-}
      SMOOTH_PARCEL_DEFAULT_PHONE: ${SMOOTH_PARCEL_DEFAULT_PHONE:-}
      SMOOTH_PARCEL_FALLBACK_EMAIL: ${SMOOTH_PARCEL_FALLBACK_EMAIL:-}
      # Label PDFs hold customer addresses, so they live on their own volume
      # that nothing serves publicly — unlike /app/uploads. The API reads them
      # for authenticated download; the worker writes them, so both mount it.
      LABELS_DIR: /app/labels
    volumes:
      - uploads:/app/uploads
      - shipping-labels:/app/labels
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/healthz']
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smmta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smmta_next}
      COMPANY_ID: ${COMPANY_ID:-11111111-1111-4111-8111-111111111111}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PGBOSS_SCHEMA: pgboss
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DAILY_CAP_MICROUSD: ${OPENROUTER_DAILY_CAP_MICROUSD:-2000000}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_SANDBOX: ${SENDGRID_SANDBOX:-true}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?set UNSUBSCRIBE_SECRET}
      WORKER_HEALTH_PORT: '3100'
      # Smooth Parcel shipping labels. OFF until SMOOTH_PARCEL_ENABLED is set;
      # with it off, paid orders record a DISABLED label and nothing is bought.
      # BETA unless told otherwise — LIVE is https://api.smoothparcel.com. Set
      # the username (account email) and password in Coolify, never the repo.
      SMOOTH_PARCEL_ENABLED: ${SMOOTH_PARCEL_ENABLED:-false}
      SMOOTH_PARCEL_API_BASE_URL: ${SMOOTH_PARCEL_API_BASE_URL:-https://api-beta.smoothparcel.com}
      SMOOTH_PARCEL_USERNAME: ${SMOOTH_PARCEL_USERNAME:-}
      SMOOTH_PARCEL_PASSWORD: ${SMOOTH_PARCEL_PASSWORD:-}
      SMOOTH_PARCEL_SENDER_NAME: ${SMOOTH_PARCEL_SENDER_NAME:-}
      SMOOTH_PARCEL_DEFAULT_PHONE: ${SMOOTH_PARCEL_DEFAULT_PHONE:-}
      SMOOTH_PARCEL_FALLBACK_EMAIL: ${SMOOTH_PARCEL_FALLBACK_EMAIL:-}
      # Label PDFs hold customer addresses, so they live on their own volume
      # that nothing serves publicly — unlike /app/uploads. The API reads them
      # for authenticated download; the worker writes them, so both mount it.
      LABELS_DIR: /app/labels
    volumes:
      - shipping-labels:/app/labels
    expose:
      - '3100'

  store:
    build:
      context: .
      dockerfile: docker/store.Dockerfile
      args:
        # Baked in at build: next/image's remotePatterns allow-list is read by
        # `next build`, not at runtime. The SMMTA_API_PUBLIC_URL below in
        # `environment:` cannot configure it — only this can. Changing the API's
        # public host therefore needs a rebuild, not just a restart.
        SMMTA_API_PUBLIC_URL: ${APP_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # The storefront reads catalogue/pricing from the API and its own store DB.
      # Base URL must include the /api/v1 prefix (the store appends paths to it).
      SMMTA_API_BASE_URL: ${SMMTA_API_BASE_URL:-http://api:3000/api/v1}
      SMMTA_API_KEY: ${SMMTA_API_KEY:?set SMMTA_API_KEY (issue-store-key)}
      # The storefront's own public URL — used for canonical tags, Open Graph,
      # sitemap.xml, robots.txt and order-confirmation links. Set to the public
      # HTTPS hostname in Coolify; falls back to localhost for local dev.
      STORE_BASE_URL: ${STORE_BASE_URL:-http://localhost:3000}
      # Shared secret the API presents on /api/internal/* calls. Must equal the
      # API's STORE_INTERNAL_API_KEY — see the note on the api service.
      ADMIN_API_KEY: ${STORE_INTERNAL_API_KEY:-}
      # The storefront creates its own Mollie payments (separate from the API's
      # pre-order flow), so it needs the key directly rather than relying on the
      # deploy platform happening to inject it into every container.
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      # Origin Mollie calls back on. Empty falls back to STORE_BASE_URL, which is
      # correct in production — the webhook route is on the storefront. Override
      # only for local development (e.g. an ngrok tunnel).
      MOLLIE_WEBHOOK_URL_BASE: ${MOLLIE_WEBHOOK_URL_BASE:-}
      # The storefront sends its own transactional email (order confirmations,
      # back-in-stock) from its outbox — it does not proxy through the API — so
      # it needs the SendGrid credentials directly. Without the key every send
      # throws and the row is marked FAILED, which nothing retries.
      # SENDGRID_FROM must be a verified sender on the SendGrid account.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-sales@cleverdeals.net}
      # Public origin of the API. The next/image allow-list is set by the
      # build arg above, not by this — kept only so the value is visible to
      # anything that reads it at runtime.
      SMMTA_API_PUBLIC_URL: ${APP_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-smmta}:${POSTGRES_PASSWORD}@postgres:5432/smmta_store
    expose:
      - '3000'

  # Drains the storefront's email outbox (order confirmations, back-in-stock).
  # The store only ENQUEUES rows — /api/internal/process-outbox is what actually
  # hands them to SendGrid, and nothing calls it on its own. Without this service
  # customers pay and never receive a confirmation, with the rows sitting PENDING
  # and no error anywhere. Kept in compose rather than as platform cron config so
  # a self-hoster gets working email from `docker compose up` alone.
  # Requires STORE_INTERNAL_API_KEY (the store checks it as ADMIN_API_KEY).
  outbox-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      store:
        condition: service_started
    environment:
      ADMIN_API_KEY: ${STORE_INTERNAL_API_KEY:-}
      OUTBOX_INTERVAL_SECONDS: ${OUTBOX_INTERVAL_SECONDS:-60}
    entrypoint: ['/bin/sh', '-c']
    # Logs the drainer's JSON result and the HTTP status on every pass. The
    # first version piped both to /dev/null, so a run of 403s from SendGrid
    # left no trace anywhere and the queue looked simply idle. `|| true` keeps
    # the loop alive across a failed poll without hiding what happened.
    command:
      - 'while true; do echo "[outbox] polling"; curl -sS -m 30 -X POST -H "Authorization: Bearer $${ADMIN_API_KEY}" http://store:3000/api/internal/process-outbox; echo; sleep $${OUTBOX_INTERVAL_SECONDS}; done'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Baked in at build. Point the SPA at the API's public URL, or use the
        # nginx same-origin /api proxy (default).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    expose:
      - '80'

volumes:
  pgdata:
  # Product image uploads. Back this up with the database — losing it loses
  # every photograph an operator has uploaded.
  uploads:
  # Shipping label PDFs. PRIVATE: customer names and addresses. Never serve this
  # directory; back it up alongside the database.
  shipping-labels:
